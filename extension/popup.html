<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 260px; font-family: system-ui, sans-serif; padding: 12px; }
    label { display: block; margin: 8px 0 4px; font-size: 13px; }
    input, select { width: 100%; padding: 6px; box-sizing: border-box; }
    button { margin-top: 12px; width: 100%; padding: 8px; }
    #status { margin-top: 8px; font-size: 12px; color: #333; min-height: 14px; }
  </style>
</head>
<body>
  <h3 style="margin:0 0 8px">Email Assistant</h3>
  <label for="apiKey">Gemini API Key</label>
  <input type="password" id="apiKey" placeholder="AIza...">
  <label for="backendUrl">Backend URL</label>
  <input type="text" id="backendUrl" placeholder="http://localhost:8080">
  <label for="tone">Tone</label>
  <select id="tone">
    <option value="">Default</option>
    <option value="professional">Professional</option>
    <option value="friendly">Friendly</option>
    <option value="formal">Formal</option>
    <option value="casual">Casual</option>
  </select>
  <button id="save">Save</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
